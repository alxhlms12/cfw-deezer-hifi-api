name = "cfw-deezer-hifi-api"
main = "worker.js"
compatibility_date = "2026-09-13"

workers_dev = true

# Cloudflare Workers Free plan safety ceiling.
# Free currently allows 10 ms CPU per HTTP invocation.
[limits]
cpu_ms = 10
subrequests = 50

# ============================================================
# DEFAULT ENVIRONMENT
# ============================================================
#
# IMPORTANT:
# There is intentionally ONLY ONE ARL field here.
#
# Put the user's Deezer ARL in DEEZER_ARL.
# Do NOT add DEEZER_ARL_1, DEEZER_ARL_2, etc. to this default.
#
# For real production deployment, DEEZER_ARL should ideally be
# stored as a Wrangler secret instead of plaintext in this file:
#
#   npx wrangler secret put DEEZER_ARL
#
# ============================================================

[vars]

# -------------------------
# CORS / API authentication
# -------------------------

CORS_ALLOW_ORIGIN = "*"

# Keep API authentication enabled by default.
PUBLIC_API = "false"
REQUIRE_API_KEY = "true"
ALLOW_QUERY_API_KEY = "false"

# Leave these empty in the template.
# They are intentionally NOT additional ARL fields.
ADMIN_API_KEY = ""

# -------------------------
# THE ONE ARL FIELD
# -------------------------

DEEZER_ARL = ""

# -------------------------
# Client API authentication
# -------------------------
#
# Empty by default.
# If REQUIRE_API_KEY remains true, configure an API_KEY secret
# separately when deploying.
#
API_KEY = ""
KEY = ""

# -------------------------
# Playback / catalog defaults
# -------------------------

DEFAULT_QUALITY = "best"
DEFAULT_ALLOW_ALT = "false"
DEFAULT_EXPLICIT = "false"

LOAD_BALANCING_STRATEGY = "random"

# -------------------------
# Deezer session handling
# -------------------------

SESSION_TTL_HOURS = "2"
LICENSE_TOKEN_TTL_MINUTES = "45"

MEDIA_RESOLUTION_TIMEOUT_MS = "8000"
MEDIA_REAUTH_RETRIES = "1"

MEDIA_INFLIGHT_TTL_MS = "5000"
TRACK_TOKEN_INFLIGHT_TTL_MS = "5000"

UPSTREAM_TIMEOUT_MS = "8000"

# -------------------------
# Streaming
# -------------------------

STREAM_CDN_HOSTS = "*.dzcdn.net;media.deezer.com"

# Conservative Free-plan settings.
# 256 KiB reduces memory/CPU pressure compared with 512 KiB.
STREAM_CHUNK_SIZE = "262144"
STREAM_MAX_CHUNK_SIZE_BYTES = "262144"

# Fallback chunk-size variable.
CHUNK_SIZE = "262144"

# Temporary stream-token security.
STREAM_TOKEN_SECRET = ""
STREAM_TOKEN_TTL_SECONDS = "600"

# Playback session.
STREAM_SESSION_TTL_SECONDS = "1800"
STREAM_SESSION_REFRESH_THRESHOLD_SECONDS = "300"

# Stronger copy/replay resistance.
STREAM_TOKEN_BIND_USER_AGENT = "true"
STREAM_REQUIRE_BOOTSTRAP = "true"

# Decrypted audio should not be cached by browsers/CDNs.
STREAM_CACHE_CONTROL = "private, no-store"

# -------------------------
# Device-bound playback
# -------------------------

# Disabled by default for maximum compatibility.
DEVICE_BOUND_SIGNED_STREAMS = "false"

DEVICE_BOUND_SECRET = ""
DEVICE_BOUND_TOKEN_TTL_SECONDS = "2592000"

# Fixed by the worker, but included here for completeness.
DEVICE_CREDENTIAL_COOKIE = "__Host-VoriaDevice"

# -------------------------
# Root page / branding
# -------------------------

TITLE = "cfw-deezer-hifi-api"
IMG = ""
IMG_TB = ""

# -------------------------
# Search / shared cache
# -------------------------

SEARCH_CACHE_TTL_SECONDS = "30"
CACHE_TTL_DAYS = "30"

# -------------------------
# Rate limiting
# -------------------------
#
# The Worker has a local fallback limiter.
# 2 RPS is deliberately conservative for the Free plan.
#
RATE_LIMIT = "2"
RATE_LIMIT_FAIL_CLOSED = "false"

# -------------------------
# Lossless account handling
# -------------------------

SPARE_LOSSLESS_ARL = "true"

# -------------------------
# Response formatting
# -------------------------

# Compact JSON saves CPU and bandwidth.
PRETTY_JSON = "false"

# -------------------------
# Instance metadata
# -------------------------

INSTANCE_NAME = "cfw-deezer-hifi-api"
NOTES = "Default Free-plan configuration"

# -------------------------
# Maintenance / feature flags
# -------------------------

MAINTENANCE_MODE = "false"
MAINTENANCE_MESSAGE = "Service temporarily unavailable for maintenance."

DISABLE_RECOMMENDATIONS = "false"
DISABLE_LYRICS = "false"


# ============================================================
# OPTIONAL CLOUDFLARE KV
# ============================================================
#
# GENERAL_MUSIC_CACHE is optional in v1.4.18.
# The Worker checks whether this binding exists before using it.
#
# After creating a KV namespace, uncomment and replace the ID:
#
# [[kv_namespaces]]
# binding = "GENERAL_MUSIC_CACHE"
# id = "YOUR_KV_NAMESPACE_ID"
#
# ============================================================


# ============================================================
# OPTIONAL CLOUDFLARE RATE LIMITING
# ============================================================
#
# RATE_LIMITER is also optional.
# If this binding is absent, the Worker's local RATE_LIMIT
# fallback is used.
#
# If your Cloudflare account supports the Rate Limiting binding,
# configure the appropriate binding here.
#
# [unsafe.bindings]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "YOUR_RATE_LIMIT_NAMESPACE_ID"
#
# ============================================================
